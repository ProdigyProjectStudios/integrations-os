<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">IntegrationOS — connect systems, orchestrate workflows, inspect execution traces</title>
  <desc id="desc">Illustrative architecture banner with a connected workflow and trace motif. This is not a screenshot of the deployed application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D19"/><stop offset=".58" stop-color="#10192D"/><stop offset="1" stop-color="#071523"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F83FC"/><stop offset="1" stop-color="#35D1E9"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4B83F4"/><stop offset="1" stop-color="#45D2E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.42" r=".55">
      <stop offset="0" stop-color="#1C68BD" stop-opacity=".21"/><stop offset="1" stop-color="#1C68BD" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#A5C5EE" stroke-width=".65" opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#020611" flood-opacity=".65"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1278" height="458" rx="24" fill="url(#bg)" stroke="#233249" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="458" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="458" rx="24" fill="url(#glow)"/>
  <path d="M34 370 H605" stroke="#365779" stroke-width="1" opacity=".38"/>
  <rect x="58" y="58" width="36" height="36" rx="10" fill="#16294C" stroke="#4979AD"/>
  <path d="M69 76 L76 68 L83 76 L76 84 Z M76 68 L88 68 M83 76 L88 84" stroke="#6EC7F1" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="108" y="81" fill="#A4B9D7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">INTEGRATION / OS</text>
  <rect x="58" y="119" width="160" height="25" rx="12" fill="#172B45" stroke="#315D83"/>
  <circle cx="72" cy="131.5" r="4" fill="#3CD8B3"/>
  <text x="83" y="136" fill="#A8C7E4" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">ENGINEERING CORE</text>
  <text x="57" y="207" fill="#F0F5FF" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="45">Connect systems.</text>
  <text x="57" y="263" fill="#F0F5FF" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="45">Orchestrate work.</text>
  <text x="57" y="314" fill="#58BEEB" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34">Trace every execution.</text>
  <text x="58" y="402" fill="#869AB6" font-family="Arial, Helvetica, sans-serif" font-size="15">VERSIONED WORKFLOWS  ·  DURABLE QUEUES  ·  HUMAN APPROVALS</text>
  <g filter="url(#shadow)">
    <rect x="653" y="50" width="566" height="360" rx="18" fill="#0D1729" stroke="#31506F" stroke-width="1.4"/>
    <rect x="653" y="50" width="566" height="54" rx="18" fill="#15233A"/>
    <path d="M653 87 H1219" stroke="#263E5C"/>
    <circle cx="683" cy="77" r="5" fill="#FF7878"/>
    <circle cx="702" cy="77" r="5" fill="#F5C369"/>
    <circle cx="721" cy="77" r="5" fill="#59CEB1"/>
    <text x="746" y="82" fill="#B9C9DD" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">EXECUTION / TRACE</text>
    <rect x="1116" y="67" width="82" height="22" rx="11" fill="#10392F" stroke="#296653"/>
    <text x="1133" y="82" fill="#67D7AE" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">DURABLE</text>
    <text x="682" y="130" fill="#7894B5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">WORKFLOW NODES</text>
    <text x="1060" y="130" fill="#7894B5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TIMELINE</text>
    <path d="M1014 145V375" stroke="#355477" stroke-width="1" opacity=".5"/>
    <path d="M1050 145V375 M1092 145V375 M1134 145V375 M1176 145V375" stroke="#34516B" stroke-dasharray="2 5" opacity=".45"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="15">
      <circle cx="689" cy="170" r="5" fill="#52C0E8"/>
      <text x="707" y="175" fill="#D7E7F7">Event received</text>
      <rect x="1041" y="160" width="59" height="19" rx="5" fill="url(#trace)"/>
      <circle cx="689" cy="213" r="5" fill="#52C0E8"/>
      <text x="707" y="218" fill="#D7E7F7">Validate payload</text>
      <rect x="1054" y="203" width="88" height="19" rx="5" fill="#4E8CF4"/>
      <circle cx="689" cy="256" r="5" fill="#52C0E8"/>
      <text x="707" y="261" fill="#D7E7F7">Route / transform</text>
      <rect x="1072" y="246" width="67" height="19" rx="5" fill="#3BBDE0"/>
      <circle cx="689" cy="299" r="5" fill="#E7B85B"/>
      <text x="707" y="304" fill="#D7E7F7">Human decision</text>
      <rect x="1091" y="289" width="74" height="19" rx="5" fill="#D7A954"/>
      <circle cx="689" cy="342" r="5" fill="#47CEAA"/>
      <text x="707" y="347" fill="#D7E7F7">Receipt + audit</text>
      <rect x="1132" y="332" width="45" height="19" rx="5" fill="#3EBF9F"/>
    </g>
    <path d="M684 176V207 M684 219V250 M684 262V293 M684 305V336" stroke="#365572" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path d="M680 379H1194" stroke="#2A435E" stroke-width="1"/>
    <text x="683" y="397" fill="#63829F" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.5">PERSISTED STEPS  /  RECOVERY  /  OBSERVABILITY</text>
  </g>
</svg>
